# Para um repositório contendo apenas o conteúdo da pasta MeuOrcamento.
# Em monorepositório, adicione rootDir: MeuOrcamento ao serviço.
services:
  - type: web
    name: meu-orcamento
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VITE_NEON_AUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
